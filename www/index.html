<script>
'use strict';
/* =========================== util =========================== */
const $ = (s, r = document) => r.querySelector(s);
const CAP = window.Capacitor;
const NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const plug = n => { try { return NATIVE ? CAP.registerPlugin(n) : null; } catch (e) { return null; } };
const TrackP = plug('Tracker'), AppP = plug('App'), StepP = plug('StepCounter'),
      ShareP = plug('Share'), FSP = plug('Filesystem'), SBP = plug('StatusBar');

const store = {
  get(k, d) { try { const v = localStorage.getItem('sf_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sf_' + k, JSON.stringify(v)); } catch (e) { console.warn('storage', e); } }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const monday = (d = new Date()) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; };
const weekKey = (d = new Date()) => dkey(monday(d));
const monthKey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const num = n => Math.round(n).toLocaleString('id-ID');
const km = (m, dp = 2) => (m / 1000).toFixed(dp).replace('.', ',');
const dur = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? h + ':' + pad(m) + ':' + pad(x) : pad(m) + ':' + pad(x); };
const paceStr = secPerKm => { if (!isFinite(secPerKm) || secPerKm <= 0 || secPerKm > 3600) return "--'--\""; const m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60); return m + "'" + pad(s === 60 ? 59 : s) + '"'; };
const speedStr = (m, s) => s > 0 ? ((m / 1000) / (s / 3600)).toFixed(1).replace('.', ',') : '0';
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const partOfDay = (d = new Date()) => { const h = d.getHours(); return h < 11 ? 'pagi' : h < 15 ? 'siang' : h < 18 ? 'sore' : 'malam'; };
const DAYS = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const dateStr = t => { const d = new Date(t); return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' · ' + pad(d.getHours()) + '.' + pad(d.getMinutes()); };
function hav(a, b) { const R = 6371000, r = Math.PI / 180; const dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r; const x = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
function downsample(arr, max) { if (arr.length <= max) return arr.slice(); const out = [], step = (arr.length - 1) / (max - 1); for (let i = 0; i < max; i++) out.push(arr[Math.round(i * step)]); return out; }
let toastT;
function toast(msg) { let t = $('#toast'); if (t) t.remove(); t = document.createElement('div'); t.id = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200); }
function vibrate(ms = 12) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ===================== efek suara (disintesis, original) ===================== */
const SFX = {
  ctx: null,
  ready() {
    if (S.settings.sound === false) return null;
    try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { return null; }
    return this.ctx;
  },
  tone(f, t0, dur, vol, type, f2) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.03);
  },
  play(k) {
    if (!this.ready()) return; const T = this.tone.bind(this);
    switch (k) {
      case 'tap': T(1500, 0, .045, .03, 'sine', 1100); break;
      case 'pop': T(520, 0, .1, .05, 'sine', 900); break;
      case 'tick': T(880, 0, .14, .12, 'sine'); break;
      case 'go': T(660, 0, .12, .12, 'triangle'); T(990, .1, .4, .14, 'sine'); break;
      case 'km': T(1318.5, 0, .6, .11, 'sine'); T(1975.5, .09, .8, .07, 'sine'); break;
      case 'success': [784, 988, 1175, 1568].forEach((f, i) => T(f, i * .07, .5, .08, 'sine')); break;
      case 'pause': T(700, 0, .14, .07, 'sine', 480); break;
      case 'resume': T(480, 0, .14, .07, 'sine', 760); break;
      case 'error': T(300, 0, .2, .07, 'triangle', 200); break;
    }
  }
};
document.addEventListener('pointerdown', e => { if (e.target.closest('.press,.tab,.tabrec')) SFX.play('tap'); }, true);

/* =========================== ikon =========================== */
const I = {
  home: '<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  feed: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.2 2.6 3.5 5.5"/>',
  trophy: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  share: '<path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  flame: '<path d="M12 22c4 0 7-2.7 7-7 0-3.5-2.5-6-4-8-.5 2-1.5 3-3 3 0-3-1-6-4-8 0 4-3 6-3 10 0 5.5 3.3 10 7 10z"/>',
  arrow: '<path d="M7 17L17 7M9 7h8v8"/>',

function fbErr(e) {
  const c = (e && e.code) || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'Email atau password salah';
  if (c.includes('email-already')) return 'Email sudah terdaftar';
  if (c.includes('weak-password')) return 'Password minimal 6 karakter';
  if (c.includes('invalid-email')) return 'Format email salah';
  if (c.includes('network')) return 'Koneksi bermasalah';
  if (c.includes('permission-denied') || String(e && e.message).includes('insufficient permissions')) return 'Ditolak server. Cek Rules Firestore sudah di-Publish';
  return (e && e.message) || 'Gagal, coba lagi';
}

/* ============================ FIREBASE ============================ */
let F = null, fbP = null;
const userCache = {};
function fbInit() {
  if (F) return Promise.resolve(F);
  if (!window.FB_CONFIG.apiKey || !S.online) return Promise.resolve(null);
  if (fbP) return fbP;
  const base = 'https://www.gstatic.com/firebasejs/11.0.2/';
  fbP = Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]).then(([ap, au, fs]) => {
    const app = ap.initializeApp(window.FB_CONFIG);
    F = { auth: au.getAuth(app), db: fs.getFirestore(app), au, fs };
    au.onAuthStateChanged(F.auth, onAuth);
    return F;
  }).catch(e => { console.warn('firebase', e); fbP = null; return null; });
  return fbP;
}
async function onAuth(u) {
  if (!u) { if (S.user) { S.user = null; store.set('user', null); if (nav.cur && SCREENS[nav.cur.name].tab) refresh(); } return; }
  try {
    const snap = await F.fs.getDoc(F.fs.doc(F.db, 'users', u.uid));
    const d = snap.exists() ? snap.data() : {};
    S.user = { uid: u.uid, email: u.email, name: d.name || u.displayName || 'Kamu', username: d.username || '', following: d.following || [] };
  } catch (e) { S.user = Object.assign({ following: [] }, S.user || {}, { uid: u.uid, email: u.email }); }
  store.set('user', S.user);
  if (nav.cur && SCREENS[nav.cur.name].tab) refresh();
  autoSync();
}
async function fbRegister(name, username, mail, pass) {
  const f = await fbInit(); if (!f) throw new Error('Firebase belum siap');
  let cr;
  try { cr = await f.au.createUserWithEmailAndPassword(f.auth, mail, pass); }
  catch (e) {
    if (!String(e && e.code).includes('email-already')) throw e;
    cr = await f.au.signInWithEmailAndPassword(f.auth, mail, pass); // akun setengah jadi dari percobaan sebelumnya
    const mine = await f.fs.getDoc(f.fs.doc(f.db, 'users', cr.user.uid));
    if (mine.exists()) { await onAuth(cr.user); return; }
  }
  const ex = await f.fs.getDocs(f.fs.query(f.fs.collection(f.db, 'users'), f.fs.where('username', '==', username)));
  if (!ex.empty && ex.docs[0].id !== cr.user.uid) { try { await cr.user.delete(); } catch (e) {} throw new Error('Username sudah dipakai, coba yang lain'); }
  await f.au.updateProfile(cr.user, { displayName: name });
  await f.fs.setDoc(f.fs.doc(f.db, 'users', cr.user.uid), { name, username, following: [], createdAt: f.fs.serverTimestamp() });
  S.user = { uid: cr.user.uid, email: mail, name, username, following: [] }; store.set('user', S.user);
}
async function fbLogin(mail, pass) {
  const f = await fbInit(); if (!f) throw new Error('Firebase belum siap');
  const cr = await f.au.signInWithEmailAndPassword(f.auth, mail, pass);
  await onAuth(cr.user);
}
const authed = () => F && F.auth.currentUser;
let syncing = false;
async function syncAll(force) {
  if (syncing || !S.online || !S.user) return false;
  if (!force && !S.settings.autoSync) return false;
  const f = await fbInit(); if (!f || !f.auth.currentUser) return false;
  syncing = true;
  try {
    const uid = f.auth.currentUser.uid;
    for (const a of S.acts.filter(x => !x.synced)) {
      const o = Object.assign({}, a); delete o.synced;
      o.uid = uid; o.userName = S.user.name; o.path = (a.path || []).map(p => ({ a: p[0], o: p[1] })); // Firestore nggak terima array bersarang
      await f.fs.setDoc(f.fs.doc(f.db, 'activities', a.id), o, { merge: true });
      a.synced = true;
    }
    saveActs();
    for (let i = 0; i < 14; i++) {
      const d = addDays(new Date(), -i), k = dkey(d), s = S.steps.days[k]; if (!s) continue;
      await f.fs.setDoc(f.fs.doc(f.db, 'daily', uid + '_' + k), { uid, date: k, week: weekKey(d), steps: s });
    }
    if (nav.cur && (nav.cur.name === 'home' || nav.cur.name === 'history')) refresh();
    return true;
  } catch (e) { console.warn('sync', e); return false; } finally { syncing = false; }
}
function autoSync() { if (S.settings.autoSync) syncAll(false); }
async function fbDelete(id) { try { const f = await fbInit(); if (f && authed()) await f.fs.deleteDoc(f.fs.doc(f.db, 'activities', id)); } catch (e) {} }
const fromRemote = d => Object.assign({}, d, { path: (d.path || []).map(p => [p.a, p.o]) });
async function getUsers(ids) {
  const need = ids.filter(i => !userCache[i]);
  for (let i = 0; i < need.length; i += 30) {
    const q = F.fs.query(F.fs.collection(F.db, 'users'), F.fs.where(F.fs.documentId(), 'in', need.slice(i, i + 30)));
    (await F.fs.getDocs(q)).forEach(d => { userCache[d.id] = Object.assign({ uid: d.id }, d.data()); });
  }
  return ids.map(i => userCache[i]).filter(Boolean);
}
async function actsOf(ids, field, key) {
  const out = [];
  for (let i = 0; i < ids.length; i += 30) {
    const q = F.fs.query(F.fs.collection(F.db, 'activities'), F.fs.where('uid', 'in', ids.slice(i, i + 30)), F.fs.where(field, '==', key));
    (await F.fs.getDocs(q)).forEach(d => out.push(fromRemote(d.data())));
  }
  return out;
}
function needOnline(where) {
  if (!window.FB_CONFIG.apiKey) return '<div class="card empty rise"><p>Fitur sosial butuh Firebase. Isi konfigurasi di <b>www/index.html</b>, lalu build ulang.</p></div>';
  if (!S.user) return '<div class="card empty rise">' + ic('feed', 32, '#C5F82A') + '<p>Masuk dulu biar bisa lihat ' + where + ' teman.</p><button class="btn lime press" data-act="auth">Masuk / Daftar</button></div>';
  if (!S.online) return '<div class="card empty rise">' + ic('cloud', 32, '#FFCC00') + '<p>Kamu lagi offline. ' + where[0].toUpperCase() + where.slice(1) + ' muncul lagi begitu ada internet.</p></div>';
  return null;
}

    return '<div class="glow" style="top:-150px;left:50%;margin-left:-220px;width:440px;height:340px"></div><div class="stack gap18">' +
      '<div class="rise col" style="align-items:center;gap:6px;margin-top:6px"><div style="position:relative;width:96px;height:96px"><span aria-hidden="true" style="position:absolute;inset:0;border-radius:50%;border:2px dashed var(--lime);animation:spin 18s linear infinite"></span><span class="avatar" style="position:absolute;inset:7px;font-size:28px;font-weight:800">' + esc(initials(name)) + '</span></div>' +
      '<h1 style="margin:6px 0 0;font-size:26px;font-weight:800;letter-spacing:-.8px">' + esc(name) + '</h1><span class="mut" style="font-size:14px">' + (S.user ? '@' + esc(S.user.username) + ' · ' + (S.user.following || []).length + ' diikuti' : 'Mode offline') + '</span></div>' +
      '<div class="card stat3 rise" style="--d:.05s;border-radius:24px;padding:14px 0"><div><b style="font-size:20px;font-weight:800">' + km(t.dist, 0) + '</b><small>km total</small></div><i></i><div><b style="font-size:20px;font-weight:800">' + t.count + '</b><small>aktivitas</small></div><i></i><div><b style="font-size:20px;font-weight:800;color:var(--lime)">' + bestStreak() + '</b><small>streak terbaik</small></div></div>' +
      '<section class="rise col gap10" style="--d:.1s"><div class="row between"><h2 class="h2">Badge</h2><span class="mut" style="font-size:13px">' + badges().filter(b => b.ok).length + ' dari 8</span></div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">' +
      badges().map((b, i) => '<div style="aspect-ratio:1;border-radius:22px;background:' + (b.ok ? (i % 3 === 0 ? 'var(--lime)' : '#1C1C1F') : '#0F0F11') + ';color:' + (b.ok && i % 3 === 0 ? 'var(--ink)' : b.ok ? 'var(--txt)' : '#48484A') + ';border:1px ' + (b.ok ? 'solid var(--line)' : 'dashed #2C2C2E') + ';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;animation:pop .5s cubic-bezier(.2,.9,.3,1.4) ' + (0.15 + i * 0.05).toFixed(2) + 's both"><span style="font-size:19px;font-weight:800;letter-spacing:-.5px">' + b.v + '</span><span style="font-size:9.5px;font-weight:600;text-align:center;padding:0 2px">' + b.n + '</span></div>').join('') + '</div></section>' +
      '<section class="card list rise" style="--d:.15s;border-radius:22px">' + '<button class="li press" data-act="history"><span>Riwayat aktivitas</span><span class="row gap6 v">' + t.count + ic('chev', 16) + '</span></button>' + set('target', 'Target harian', num(S.settings.target) + ' langkah') + set('stride', 'Panjang langkah', S.settings.stride + ' cm') + set('weight', 'Berat badan', S.settings.weight + ' kg') + '</section>' +
      '<section class="card list rise" style="--d:.2s;border-radius:22px">' + sw('autoSync', 'Sinkron otomatis') + sw('sound', 'Efek suara') + '<button class="li press" data-act="diag"><span>Diagnostik</span>' + ic('chev', 16, '#8E8E93') + '</button>' +
      (S.user ? '<button class="li press" data-act="syncNow"><span>Sinkron sekarang</span><span class="v">' + (unsynced ? unsynced + ' belum' : 'Beres') + '</span></button><button class="li press" data-act="logout"><span style="color:var(--red)">Keluar akun</span></button>' : '<button class="li press" data-act="auth"><span class="lime" style="font-weight:600">Masuk / Daftar akun</span>' + ic('chev', 16, '#C5F82A') + '</button>') + '</section>' +
      '<p class="mut" style="text-align:center;font-size:12px;margin:0">Strafunk v1.0 · data tersimpan di HP' + (S.user ? ' & cloud' : '') + '</p></div>';
  }
};
ACT.sw = t => { const k = t.dataset.v; S.settings[k] = !S.settings[k]; saveSettings(); t.classList.toggle('on', S.settings[k]); t.setAttribute('aria-checked', S.settings[k]); vibrate(10); if (k === 'autoSync' && S.settings[k]) autoSync(); };
ACT.edit = t => {
  const k = t.dataset.v, cfg = { target: ['Target harian', 500, 1000, 50000, ' langkah'], stride: ['Panjang langkah', 1, 40, 120, ' cm'], weight: ['Berat badan', 1, 30, 200, ' kg'] }[k];
  let v = S.settings[k];
  openSheet('<h3>' + cfg[0] + '</h3>' + (k === 'stride' ? '<p>Dipakai buat estimasi jarak saat GPS lemah / di dalam ruangan. Kira-kira tinggi badan × 0,42.</p>' : '') + '<div class="stepper"><button class="press" id="mn" aria-label="Kurangi">−</button><b id="vv">' + num(v) + '</b><button class="press" id="pl" aria-label="Tambah">+</button></div><span class="mut" style="text-align:center;font-size:13px;margin-top:-6px">' + cfg[4].trim() + '</span><button class="btn lime press" id="ok">Simpan</button>', s => {
    const upd = d => { v = Math.min(cfg[3], Math.max(cfg[2], v + d)); s.querySelector('#vv').textContent = num(v); vibrate(6); };
    s.querySelector('#mn').onclick = () => upd(-cfg[1]); s.querySelector('#pl').onclick = () => upd(cfg[1]);
    s.querySelector('#ok').onclick = () => { S.settings[k] = v; saveSettings(); closeSheet(true); refresh(); toast('Tersimpan'); };
  });
};
ACT.diag = async () => {
  const L = [];
  L.push('Native: ' + NATIVE + ' · bridge: ' + (CAP ? typeof CAP.registerPlugin : 'none'));
  L.push('Plugin Tracker: ' + !!TrackP + ' · Langkah: ' + !!StepP + ' · App: ' + !!AppP);
  if (TrackP) { try { const s = await TrackP.status(); Object.keys(s).forEach(k => L.push(k + ': ' + s[k])); } catch (e) { L.push('status error: ' + (e.message || e)); } }
  if (StepP) { try { const a = await StepP.isAvailable(); L.push('sensor langkah: ' + a.available + ' · izin: ' + a.granted); } catch (e) { L.push('langkah error: ' + (e.message || e)); } }
  L.push('stepState: ' + S.stepState + ' · counter: ' + S.steps.last + ' · hari ini: ' + todaySteps());
  L.push('Online: ' + S.online + ' · akun: ' + (S.user ? '@' + S.user.username : '-'));
  if (REC) L.push('REC: ' + REC.type + ' native=' + REC.native + ' fix=' + REC.gotFix + ' acc=' + REC.acc + ' dist=' + Math.round(REC.dist));
  openSheet('<h3>Diagnostik</h3><pre style="margin:0;padding:14px;border-radius:16px;background:#0F0F11;font-size:12px;line-height:1.6;white-space:pre-wrap;color:#D1D1D6;-webkit-user-select:text;user-select:text">' + esc(L.join('\n')) + '</pre><p>Kalau ada masalah, screenshot layar ini.</p>');
};
ACT.syncNow = async () => { if (!S.online) { toast('Lagi offline'); return; } toast('Menyinkronkan…'); const ok = await syncAll(true); toast(ok ? 'Sinkron beres' : 'Gagal sinkron'); refresh(); };
ACT.logout = () => openSheet('<h3>Keluar akun?</h3><p>Aktivitas di HP tetap aman.</p><button class="btn press" id="lo" style="color:var(--red)">Keluar</button><button class="btn ghost press" data-act="closeSheet">Batal</button>', s => {
  s.querySelector('#lo').onclick = async () => { try { if (F) await F.au.signOut(F.auth); } catch (e) {} S.user = null; store.set('user', null); closeSheet(true); refresh(); toast('Sudah keluar'); };
});

/* ============================ BOOT ============================ */
function netChange() {
  S.online = navigator.onLine;
  const d = $('#netDot'), t = $('#netTxt'); if (d) { d.style.background = S.online ? '#30D158' : '#FFCC00'; t.textContent = S.online ? 'Online' : 'Offline'; }
  if (S.online) { fbInit().then(() => autoSync()); toast('Online lagi · menyinkronkan'); }
  else toast('Offline · semua tetap kerekam');
  if (REC) updateRecUI();
  if (nav.cur && (nav.cur.name === 'feed' || nav.cur.name === 'ranking')) refresh();
}
window.addEventListener('online', netChange); window.addEventListener('offline', netChange);
if (AppP) {
  AppP.addListener('backButton', back);
  AppP.addListener('appStateChange', s => {
    if (s.isActive) { if (StepP && S.stepState === 'granted') StepP.start().catch(() => {}); syncFromNative(); if (nav.cur && nav.cur.name === 'home') refresh(); }
    else { store.set('steps', S.steps); if (StepP && !REC) StepP.stop().catch(() => {}); }
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') back(); });
(async function boot() {
  try { if (SBP) { SBP.setStyle({ style: 'DARK' }).catch(() => {}); SBP.setBackgroundColor({ color: '#000000' }).catch(() => {}); } } catch (e) {}
  if (S.onboarded) { await initSteps(true); go('home', {}, 'tab'); syncFromNative(); }
  else go('auth', {}, 'tab');
  fbInit();
  setInterval(() => { if (!REC && nav.cur && nav.cur.name === 'home' && !NATIVE) updateHomeSteps(); }, 5000);
})();
</script>
</body>
</html>
