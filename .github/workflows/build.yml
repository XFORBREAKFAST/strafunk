name: Build Strafunk APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Keystore tetap (biar update tanpa uninstall)
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK native (release)
        run: gradle :app:assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Strafunk.apk

      - name: Cek tanda tangan (harus kunci tetap)
        run: python3 tools/apkcert.py Strafunk.apk 941691fc3e8c26de6945d3f7

      - uses: actions/upload-artifact@v4
        with:
          name: Strafunk-APK
          path: Strafunk.apk

      - name: Publish ke Releases (main = Latest, cabang lain = pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ github.run_number }}
          name: Strafunk build ${{ github.run_number }}
          files: Strafunk.apk
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
